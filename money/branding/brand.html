<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../engine/fonts/fonts.css">
<style>html,body{margin:0;background:#06140F}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
// How Money Moves channel art. ?kind=avatar|banner
const q=new URLSearchParams(location.search),KIND=q.get('kind');const C=document.getElementById('c'),X=C.getContext('2d');
const GOLD='#F5C542',GOLD2='#C9931E',GREEN='#1FD68A',INK='#06140F',WH='#F3F7F5',MU='#9FB8AD';
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function bg(w,h){const g=X.createRadialGradient(w*.5,h*.45,50,w*.5,h*.5,Math.max(w,h)*.8);g.addColorStop(0,'#0F2E22');g.addColorStop(1,INK);X.fillStyle=g;X.fillRect(0,0,w,h);
  X.strokeStyle='rgba(31,214,138,.06)';X.lineWidth=2;for(let x=0;x<=w;x+=80){X.beginPath();X.moveTo(x,0);X.lineTo(x,h);X.stroke()}for(let y=0;y<=h;y+=80){X.beginPath();X.moveTo(0,y);X.lineTo(w,y);X.stroke()}}
function coin(cx,cy,r){ // gold coin with a $ and two flow arrows circling it
  const g=X.createLinearGradient(cx-r,cy-r,cx+r,cy+r);g.addColorStop(0,'#FFE38A');g.addColorStop(.5,GOLD);g.addColorStop(1,GOLD2);
  X.save();X.shadowColor='rgba(245,197,66,.45)';X.shadowBlur=r*.5;X.beginPath();X.arc(cx,cy,r,0,7);X.fillStyle=g;X.fill();X.restore();
  X.lineWidth=r*.06;X.strokeStyle='rgba(120,80,10,.55)';X.beginPath();X.arc(cx,cy,r*.82,0,7);X.stroke();
  X.font=`900 ${r*1.15}px Cairo`;X.textAlign='center';X.textBaseline='middle';X.fillStyle='#7A520C';X.fillText('$',cx,cy+r*.06);
  // flow arrows
  X.lineWidth=r*.11;X.lineCap='round';X.strokeStyle=GREEN;
  [[-0.35,1.45],[2.8,4.6]].forEach(([a0,a1])=>{X.beginPath();X.arc(cx,cy,r*1.28,a0,a1);X.stroke();
    const ex=cx+Math.cos(a1)*r*1.28,ey=cy+Math.sin(a1)*r*1.28,an=a1+Math.PI/2;X.fillStyle=GREEN;X.beginPath();
    X.moveTo(ex+Math.cos(an)*r*.26,ey+Math.sin(an)*r*.26);X.lineTo(ex+Math.cos(an-2.3)*r*.22,ey+Math.sin(an-2.3)*r*.22);X.lineTo(ex+Math.cos(an+2.3)*r*.22,ey+Math.sin(an+2.3)*r*.22);X.closePath();X.fill()});
}
function chart(x0,y0,w,h,a){X.save();X.globalAlpha=a;X.strokeStyle=GREEN;X.lineWidth=6;X.beginPath();let y=y0;for(let i=0;i<=40;i++){const x=x0+w*i/40;y=y0-h*(i/40)+Math.sin(i*1.3)*h*.08*(rnd(i)+.3);i?X.lineTo(x,y):X.moveTo(x,y)}X.stroke();X.restore()}
function avatar(){const S=800;C.width=C.height=S;bg(S,S);coin(S/2,S/2,195)}
function banner(){const W=2560,H=1440;C.width=W;C.height=H;bg(W,H);
  chart(120,1250,700,420,.35);chart(1800,1300,640,520,.35);
  for(let i=0;i<26;i++){X.save();X.globalAlpha=.08+rnd(i)*.12;X.font=`900 ${40+rnd(i+3)*70}px Cairo`;X.fillStyle=i%3?GOLD:GREEN;const sx2=rnd(i+7)*W,sy2=rnd(i+11)*H;if(!(sx2>420&&sx2<2140&&sy2>440&&sy2<1000))X.fillText(['$','%','€','£','¥'][i%5],sx2,sy2);X.restore()}
  const sx=(W-1546)/2,cy=H/2;coin(sx+190,cy,140);
  X.textAlign='left';X.textBaseline='middle';X.font='900 150px Cairo';X.fillStyle=WH;X.fillText('How Money',sx+400,cy-55);
  const w1=X.measureText('How Money ').width;X.fillStyle=GOLD;X.fillText('Moves',sx+400+w1,cy-55);
  X.font='700 54px Cairo';X.fillStyle=MU;X.fillText('The hidden mechanics of money, explained',sx+405,cy+80);
}
document.fonts.ready.then(()=>Promise.all([700,900].map(w=>document.fonts.load(`${w} 40px Cairo`,'How Money $')))).then(()=>{KIND==='avatar'?avatar():banner();window.done=true});
</script></body></html>
