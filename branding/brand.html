<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../engine/fonts/fonts.css">
<style>html,body{margin:0;background:#0B1426}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>window.LANG='en'</script>
<script src="../engine/lib.js"></script>
<script>
// Channel art in the same palette as the videos. ?kind=avatar|banner&name=...
const q=new URLSearchParams(location.search),KIND=q.get('kind'),NAME=q.get('name')||'How It Started';
const C2=document.getElementById('c');
function grid(w,h,step){X.strokeStyle='rgba(255,255,255,.04)';X.lineWidth=2;for(let x=0;x<=w;x+=step){X.beginPath();X.moveTo(x,0);X.lineTo(x,h);X.stroke()}for(let y=0;y<=h;y+=step){X.beginPath();X.moveTo(0,y);X.lineTo(w,y);X.stroke()}}
function atom(cx,cy,r,lw,a=1){X.save();X.globalAlpha*=a;X.lineWidth=lw;const cols=[G,D,'#6FB8FF'];
  for(let i=0;i<3;i++){X.save();X.translate(cx,cy);X.rotate(i*Math.PI/3);X.strokeStyle=cols[i];X.beginPath();X.ellipse(0,0,r,r*.36,0,0,7);X.stroke();X.restore()}
  X.restore()}
function mark(cx,cy,s){ // logo: atom orbits around a glowing question mark
  glow(cx,cy,s*1.25,'rgba(255,176,32,.28)',1);
  atom(cx,cy,s,s*.055);
  X.save();X.font=`900 ${s*1.15}px Cairo`;X.textAlign='center';X.textBaseline='middle';X.direction='ltr';
  const g=X.createLinearGradient(cx-s*.4,cy-s*.5,cx+s*.4,cy+s*.5);g.addColorStop(0,G);g.addColorStop(1,'#FF6A3D');
  X.lineJoin='round';X.lineWidth=s*.08;X.strokeStyle='rgba(4,8,18,.95)';X.strokeText('?',cx,cy+s*.05);X.fillStyle=g;X.fillText('?',cx,cy+s*.05);X.restore();
  [[0,1],[2.1,.8],[4.2,.9]].forEach(([an,k],i)=>{const cols=[G,D,'#6FB8FF'];X.save();X.translate(cx,cy);X.rotate(i*Math.PI/3);
    X.beginPath();X.arc(Math.cos(an)*s,Math.sin(an)*s*.36,s*.07,0,7);X.fillStyle=cols[i];X.fill();X.restore()});
}
const INK='#1B0F12';
function pumpjack(x,y,s,ph,col=INK){ // oil pump silhouette standing on (x,y); ph = beam angle phase
  X.save();X.translate(x,y);X.scale(s,s);X.fillStyle=col;X.strokeStyle=col;X.lineCap='round';X.lineJoin='round';
  X.fillRect(-170,-14,360,14);                                  // skid
  X.lineWidth=14;X.beginPath();X.moveTo(-60,-14);X.lineTo(0,-210);X.lineTo(60,-14);X.stroke(); // samson post
  X.lineWidth=8;X.beginPath();X.moveTo(-30,-110);X.lineTo(30,-110);X.stroke();
  const an=Math.sin(ph)*.16;
  X.save();X.translate(0,-215);X.rotate(an);
  X.fillRect(-190,-12,330,24);                                  // walking beam
  X.beginPath();X.moveTo(-190,-40);X.quadraticCurveTo(-245,0,-190,40);X.lineTo(-175,40);X.lineTo(-175,-40);X.closePath();X.fill(); // horse head
  X.fillRect(120,-6,40,12);
  X.restore();
  // crank + counterweight + pitman arm
  const cx=150,cy=-70;X.beginPath();X.arc(cx,cy,22,0,7);X.fill();
  X.save();X.translate(cx,cy);X.rotate(ph);X.beginPath();X.moveTo(0,0);X.arc(0,0,62,-.6,.6);X.closePath();X.fill();X.restore();
  const bx=150*Math.cos(an)+0,by=-215+150*Math.sin(an);X.lineWidth=10;X.beginPath();X.moveTo(cx+Math.cos(ph)*40,cy+Math.sin(ph)*40);X.lineTo(bx,by);X.stroke();
  // polished rod + wellhead under the horse head
  const hx=-215*Math.cos(an),hy=-215-215*Math.sin(an)+40;X.lineWidth=5;X.beginPath();X.moveTo(hx,hy);X.lineTo(hx,-40);X.stroke();
  X.fillRect(hx-16,-40,32,26);X.restore();
}
function sky(w,h,hz){const g=X.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#0F1B3D');g.addColorStop(.45,'#3B2A5C');g.addColorStop(.75,'#C4553A');g.addColorStop(1,'#F4A340');X.fillStyle=g;X.fillRect(0,0,w,hz+4);X.fillStyle='#F4A340';X.fillRect(0,hz,w,h-hz);
  for(let i=0;i<90;i++){const yy=rnd(i+11)*hz*.45;X.fillStyle=`rgba(255,255,255,${.15+rnd(i)*.5})`;X.beginPath();X.arc(rnd(i+3)*w,yy,1+rnd(i+5)*2.2,0,7);X.fill()}}
function sunDisc(x,y,r){glow(x,y,r*3.2,'rgba(255,190,90,.55)',1);X.save();X.beginPath();X.arc(x,y,r,0,7);const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#FFF1C2');g.addColorStop(1,'#FFB347');X.fillStyle=g;X.fill();X.restore()}
function dune(w,h,base,amp,f,off,c1,c2){X.beginPath();X.moveTo(0,h);for(let x=0;x<=w;x+=8)X.lineTo(x,base-amp*(Math.sin(x*f+off)*.6+Math.sin(x*f*2.3+off*1.7)*.4));X.lineTo(w,h);X.closePath();
  const g=X.createLinearGradient(0,base-amp,0,h);g.addColorStop(0,c1);g.addColorStop(1,c2);X.fillStyle=g;X.fill()}
function avatar(){const S=800;C2.width=C2.height=S;
  sky(S,S,560);sunDisc(400,540,120);
  dune(S,S,600,25,.008,1.2,'#B8743A','#8A4F27');
  pumpjack(390,640,1.25,.9);
  dune(S,S,690,30,.01,3.1,'#7A4424','#4E2A17');
  X.save();X.font='900 64px Cairo';X.textAlign='center';X.direction='ltr';X.lineJoin='round';X.lineWidth=10;X.strokeStyle='rgba(20,8,10,.9)';X.strokeText('?',560,300);X.fillStyle=G;X.fillText('?',560,300);X.restore();
}
function banner(){const W2=2560,H2=1440;C2.width=W2;C2.height=H2;const hz=930;
  sky(W2,H2,hz);sunDisc(1720,hz-30,150);
  dune(W2,H2,hz+10,40,.003,0.5,'#C9844A','#9A5A2E');
  // distant pumps
  pumpjack(2350,hz-2,.6,2.6,'#3A1E1A');
  dune(W2,H2,hz+120,70,.0025,2.2,'#A8622F','#6E3A1C');
  pumpjack(440,hz+150,1.6,.4);pumpjack(2050,hz+110,1.15,3.6);
  dune(W2,H2,hz+300,60,.004,4.0,'#6E3A1C','#3E2012');
  // name in the safe area (1546x423 centred)
  const sx=(W2-1546)/2,cy=H2/2;
  X.save();const sh=X.createLinearGradient(0,cy-250,0,cy+200);sh.addColorStop(0,'rgba(10,8,20,0)');sh.addColorStop(.5,'rgba(10,8,20,.35)');sh.addColorStop(1,'rgba(10,8,20,0)');X.fillStyle=sh;X.fillRect(0,cy-250,W2,450);X.restore();
  X.save();X.direction='ltr';X.textAlign='center';X.textBaseline='middle';X.font='900 170px Cairo';X.lineJoin='round';X.lineWidth=18;X.strokeStyle='rgba(20,8,10,.92)';
  const words=NAME.split(' ');const ws=words.map(w=>X.measureText(w).width),sp=X.measureText(' ').width,tot=ws.reduce((a,b)=>a+b,0)+sp*(words.length-1);
  let x=W2/2-tot/2;X.textAlign='left';words.forEach((w,i)=>{X.strokeText(w,x,cy-80);X.fillStyle=i===words.length-1?G:WH;X.fillText(w,x,cy-80);x+=ws[i]+sp});
  X.textAlign='center';X.font='800 58px Cairo';X.lineWidth=10;X.strokeText('Science explained in under a minute',W2/2,cy+50);X.fillStyle='#FFE9C7';X.fillText('Science explained in under a minute',W2/2,cy+50);
  X.direction='rtl';X.font='800 56px Cairo';X.strokeText('العلوم في أقل من دقيقة',W2/2,cy+135);X.fillStyle=D;X.fillText('العلوم في أقل من دقيقة',W2/2,cy+135);
  X.restore();
}
window.ready.then(()=>{KIND==='avatar'?avatar():banner();window.done=true});
</script></body></html>
