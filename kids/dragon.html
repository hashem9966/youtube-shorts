<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Kids channel art kit: a friendly original dragon ("Zumurrud") and a sunny forest. 2D, canvas, 1920x1080. */
const C=document.getElementById('c'),X=C.getContext('2d');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,x)=>a+(b-a)*x;
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
const DR={body:'#3FBF8A',bodyDark:'#2A9468',belly:'#FCE9A6',bellyLine:'#E8C977',wing:'#8E6CF0',wingDark:'#6B4BD1',spike:'#FF9F43',horn:'#FFF1D0',eye:'#1C2340',blush:'#FF8FA3',saddle:'#E5484D',saddleDark:'#B8323A'};
function ell(x,y,rx,ry,col,rot=0){X.beginPath();X.ellipse(x,y,rx,ry,rot,0,Math.PI*2);X.fillStyle=col;X.fill()}

function wing(bx,by,flap,col,dark,scale=1){ // flap: -1 (down) .. 1 (up)
  X.save();X.translate(bx,by);X.scale(scale,scale);X.rotate(-0.35-flap*0.75);
  const L=260,tips=[[-40,-L],[-150,-L*.78],[-235,-L*.42]];
  X.beginPath();X.moveTo(0,0);X.lineTo(tips[0][0],tips[0][1]);
  for(let i=1;i<tips.length;i++){const p=tips[i-1],q=tips[i];X.quadraticCurveTo((p[0]+q[0])/2+25,(p[1]+q[1])/2+45,q[0],q[1])}
  X.quadraticCurveTo(-150,-30,-60,10);X.closePath();X.fillStyle=col;X.fill();
  X.strokeStyle=dark;X.lineWidth=9;X.lineCap='round';tips.forEach(t=>{X.beginPath();X.moveTo(0,0);X.lineTo(t[0],t[1]);X.stroke()});
  X.fillStyle=DR.horn;tips.forEach(t=>{X.beginPath();X.arc(t[0],t[1],7,0,7);X.fill()});
  X.restore();
}
function spikes(points){X.fillStyle=DR.spike;points.forEach(([x,y,a,s])=>{X.save();X.translate(x,y);X.rotate(a);X.beginPath();X.moveTo(-14*s,0);X.quadraticCurveTo(0,-34*s,14*s,0);X.closePath();X.fill();X.restore()})}

/* dragon(x,y,s,t,opts): faces right, centred on the body. opts.saddle (default true). Returns the seat point in canvas coords. */
function dragon(x,y,s,t,opts={}){
  const flap=Math.sin(t*5.5),bob=Math.sin(t*5.5+1.2)*10;
  X.save();X.translate(x,y+bob);X.scale(s,s);X.lineJoin='round';X.lineCap='round';
  // far wing
  wing(-75,-50,flap,DR.wingDark,'#4E35A6',.92);
  // tail
  const tw=Math.sin(t*3)*12;
  X.beginPath();X.moveTo(-90,-30);X.bezierCurveTo(-200,-20+tw,-250,40+tw,-330,-10+tw*1.5);X.lineTo(-325,25+tw*1.5);X.bezierCurveTo(-240,80+tw,-180,50,-90,40);X.closePath();X.fillStyle=DR.body;X.fill();
  X.save();X.translate(-335,0+tw*1.5);X.rotate(-0.4);X.beginPath();X.moveTo(0,-30);X.lineTo(-48,8);X.lineTo(0,38);X.lineTo(-12,4);X.closePath();X.fillStyle=DR.spike;X.fill();X.restore();
  // back leg
  ell(-70,62,34,40,DR.bodyDark,0.3);ell(-62,98,28,14,DR.bodyDark);
  // body
  ell(0,0,140,86,DR.body);
  ell(28,30,96,48,DR.belly,-0.12);
  X.strokeStyle=DR.bellyLine;X.lineWidth=5;for(let i=-2;i<=2;i++){X.beginPath();X.ellipse(28+i*30,30,10,40,0,-.9,.9);X.stroke()}
  // front leg
  ell(78,60,30,38,DR.bodyDark,-0.3);ell(92,92,26,13,DR.bodyDark);
  // neck
  X.beginPath();X.moveTo(70,-60);X.bezierCurveTo(120,-120,150,-150,180,-150);X.lineTo(205,-95);X.bezierCurveTo(170,-70,140,-20,110,20);X.closePath();X.fillStyle=DR.body;X.fill();
  X.beginPath();X.moveTo(120,0);X.bezierCurveTo(150,-40,170,-70,195,-95);X.lineTo(200,-80);X.bezierCurveTo(175,-55,160,-20,140,20);X.closePath();X.fillStyle=DR.belly;X.fill();
  // back spikes
  spikes([[-200,-12+tw*.5,-0.2,.7],[-150,-38,-0.1,.85],[-95,-70,-0.05,1],[-40,-84,0,1.05],[150,-148,0.5,.8],[120,-122,0.6,.85],[95,-96,0.6,.9]]);
  // head
  ell(205,-170,78,62,DR.body);
  ell(268,-150,54,40,DR.body,0.15);
  ell(275,-135,44,22,DR.belly,0.15);
  X.fillStyle=DR.bodyDark;X.beginPath();X.arc(300,-160,6,0,7);X.arc(285,-163,5,0,7);X.fill();
  // horns
  [[170,-222,-0.5],[205,-230,-0.25]].forEach(([hx,hy,a])=>{X.save();X.translate(hx,hy);X.rotate(a);X.beginPath();X.moveTo(-12,8);X.quadraticCurveTo(-6,-40,12,-52);X.quadraticCurveTo(6,-20,12,8);X.closePath();X.fillStyle=DR.horn;X.fill();X.restore()});
  // ear frill
  X.beginPath();X.moveTo(150,-190);X.lineTo(105,-215);X.lineTo(125,-180);X.lineTo(95,-175);X.lineTo(150,-160);X.closePath();X.fillStyle=DR.wing;X.fill();
  // eye (blinks now and then)
  const blink=(t%4)>3.85?0.12:1;
  ell(215,-185,30,34*blink,'#FFFFFF');
  if(blink>.5){ell(222,-182,19,23,DR.eye);ell(230,-192,7,8,'#FFFFFF');ell(216,-174,3.5,3.5,'#FFFFFF')}
  X.strokeStyle=DR.bodyDark;X.lineWidth=6;X.beginPath();X.arc(212,-188,40,-2.4,-1.4);X.stroke();
  ell(250,-148,16,10,DR.blush+'AA');
  // smile
  X.strokeStyle=DR.eye;X.lineWidth=6;X.beginPath();X.moveTo(240,-122);X.quadraticCurveTo(275,-105,305,-125);X.stroke();
  // near wing
  wing(-60,-58,flap,DR.wing,DR.wingDark,1.0);
  // saddle
  if(opts.saddle!==false){X.save();X.translate(45,-82);X.beginPath();X.moveTo(-70,10);X.quadraticCurveTo(-75,-30,-45,-28);X.lineTo(40,-28);X.quadraticCurveTo(70,-30,65,8);X.quadraticCurveTo(0,30,-70,10);X.closePath();X.fillStyle=DR.saddle;X.fill();
    X.fillStyle=DR.saddleDark;X.beginPath();X.moveTo(40,-28);X.quadraticCurveTo(58,-60,70,-40);X.quadraticCurveTo(62,-25,52,-20);X.closePath();X.fill();
    X.strokeStyle=DR.saddleDark;X.lineWidth=8;X.beginPath();X.moveTo(-10,15);X.lineTo(-5,90);X.stroke();X.fillStyle='#F2C94C';X.beginPath();X.arc(-5,95,10,0,7);X.fill();X.restore()}
  X.restore();
  return {x:x+45*s,y:y+bob+(-110)*s};
}

/* Forest world. cam = horizontal scroll in px. */
function cloud(x,y,s){X.fillStyle='rgba(255,255,255,.95)';[[-60,10,45],[-10,-14,62],[50,6,48],[0,22,42],[90,20,30]].forEach(c=>{X.beginPath();X.arc(x+c[0]*s,y+c[1]*s,c[2]*s,0,7);X.fill()})}
function sun(x,y,r,t){const g=X.createRadialGradient(x,y,r*.3,x,y,r*3);g.addColorStop(0,'rgba(255,236,150,.9)');g.addColorStop(1,'rgba(255,236,150,0)');X.fillStyle=g;X.fillRect(x-r*3,y-r*3,r*6,r*6);
  X.save();X.translate(x,y);X.rotate(t*.15);X.fillStyle='rgba(255,214,90,.55)';for(let i=0;i<12;i++){X.rotate(Math.PI/6);X.beginPath();X.moveTo(r*1.15,-12);X.lineTo(r*1.75,0);X.lineTo(r*1.15,12);X.closePath();X.fill()}X.restore();
  ell(x,y,r,r,'#FFD54F');ell(x-r*.3,y-r*.1,r*.09,r*.12,'#7A4E1D');ell(x+r*.3,y-r*.1,r*.09,r*.12,'#7A4E1D');X.strokeStyle='#7A4E1D';X.lineWidth=r*.07;X.lineCap='round';X.beginPath();X.arc(x,y+r*.12,r*.32,.3,Math.PI-.3);X.stroke();
  ell(x-r*.5,y+r*.2,r*.13,r*.08,'rgba(255,140,120,.6)');ell(x+r*.5,y+r*.2,r*.13,r*.08,'rgba(255,140,120,.6)')}
function tree(x,base,h,kind,seed,shade){
  if(kind===0){ // round leafy tree
    X.fillStyle='#8A5A3B';X.fillRect(x-h*.06,base-h*.5,h*.12,h*.5);
    const cols=shade?['#2F8F4E','#3AA35B','#49B86A']:['#3AA35B','#4CC06D','#6AD27F'];
    [[0,-.62,.32],[-.22,-.5,.24],[.22,-.52,.25],[0,-.82,.24]].forEach((c,i)=>ell(x+c[0]*h,base+c[1]*h,c[2]*h,c[2]*h*.92,cols[i%3]));
    if(!shade){for(let i=0;i<4;i++){if(rnd(seed+i)>.5)ell(x+(rnd(seed+i+7)-.5)*h*.5,base-h*(.5+rnd(seed+i+3)*.35),h*.025,h*.025,'#FF6B6B')}}
  }else{ // pine
    X.fillStyle='#7A4E30';X.fillRect(x-h*.04,base-h*.25,h*.08,h*.25);
    const cols=shade?['#1F7A5A','#25886A']:['#2E9C70','#38B07F'];
    for(let i=0;i<3;i++){const w=h*(.34-i*.08),y0=base-h*(.2+i*.22);X.beginPath();X.moveTo(x-w,y0);X.lineTo(x,y0-h*.36);X.lineTo(x+w,y0);X.closePath();X.fillStyle=cols[i%2];X.fill()}
  }
}
function hills(cam,par,base,amp,col,f,off){X.beginPath();X.moveTo(0,1080);for(let x=0;x<=1920;x+=12)X.lineTo(x,base-amp*(Math.sin((x+cam*par)*f+off)*.6+Math.sin((x+cam*par)*f*2.1+off)*.4));X.lineTo(1920,1080);X.closePath();X.fillStyle=col;X.fill()}
function treeRow(cam,par,base,h,count,shade,seedBase){const span=1920+400;for(let i=0;i<count;i++){let x=((i*span/count-cam*par)%span+span)%span-200;tree(x,base+(rnd(seedBase+i)-.5)*30,h*(.8+rnd(seedBase+i+50)*.4),rnd(seedBase+i+9)>.55?1:0,seedBase+i,shade)}}
function birds(t){X.strokeStyle='#3A3A5A';X.lineWidth=4;X.lineCap='round';for(let i=0;i<4;i++){const bx=((i*380+t*90)%2300)-200,by=220+i*35+Math.sin(t*2+i)*10,w=Math.sin(t*8+i)*8;X.beginPath();X.moveTo(bx-18,by-w);X.quadraticCurveTo(bx-8,by-12,bx,by);X.quadraticCurveTo(bx+8,by-12,bx+18,by-w);X.stroke()}}
function forest(t,cam){
  const g=X.createLinearGradient(0,0,0,1080);g.addColorStop(0,'#7EC8FF');g.addColorStop(.6,'#BFE6FF');g.addColorStop(1,'#FFF4C9');X.fillStyle=g;X.fillRect(0,0,1920,1080);
  sun(1620,200,95,t);
  for(let i=0;i<5;i++){const cx=((i*520-cam*.08+t*12)%2500+2500)%2500-300;cloud(cx,120+rnd(i)*180,.8+rnd(i+4)*.6)}
  birds(t);
  hills(cam,.15,700,60,'#A8DDB5',.003,0);
  treeRow(cam,.25,720,220,14,true,100);
  hills(cam,.4,820,50,'#7CCB8E',.004,2);
  treeRow(cam,.55,840,300,10,false,200);
  hills(cam,.8,960,40,'#5DB872',.006,4);
  // flowers on the near hill
  for(let i=0;i<30;i++){const fx=((i*97-cam*.8)%1980+1980)%1980-30,fy=990+rnd(i)*70;ell(fx,fy,7,7,['#FF6B9A','#FFD93D','#FFFFFF','#9B7BFF'][i%4]);ell(fx,fy,3,3,'#FFB347')}
  treeRow(cam,1.1,1080,420,6,false,300);
}
window.DRAGON={dragon,forest};
window.ready=Promise.resolve();
</script></body></html>
